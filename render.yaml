# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file
# and creates BOTH the database and the API service.
#
# Secrets are marked `sync: false` on purpose: Render prompts for them at deploy
# time and stores them encrypted. They must never live in this file, which is
# committed to the repo.

databases:
  - name: harmony-db
    databaseName: harmony
    user: harmony
    plan: free            # NOTE: Render's free Postgres is DELETED after 90 days.
    region: oregon        # keep the DB and the service in the SAME region

services:
  - type: web
    name: harmony-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free            # sleeps after ~15 min idle; see the free-tier notes in README_RENDER.md
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production           # makes auth.py refuse to boot without a real key

      - key: APP_SECRET_KEY
        generateValue: true         # Render generates a strong value once and keeps it

      # The single account allowed to grant and revoke customer access.
      # Set this to YOUR email in the Render dashboard.
      - key: PLATFORM_OWNER_EMAIL
        sync: false

      # approval = new customers wait for you; open = self-serve signup
      - key: HARMONY_SIGNUP_MODE
        value: approval

      - key: APP_DATABASE_URL
        fromDatabase:
          name: harmony-db
          property: connectionString

      # --- set these in the Render dashboard; never commit them ---
      - key: MISTRAL_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # Only needed if you ever serve the UI from a DIFFERENT host. The bundled
      # UI is same-origin, so this can stay unset.
      - key: CORS_ORIGINS
        sync: false

      # Demo mode: show the verification code on screen instead of emailing it.
      # No provider account needed. Weakens verification - anyone who can reach
      # the signup form can read the code - so use it only while demoing.
      - key: HARMONY_DEMO_CODES
        value: "true"

      # --- Email ---
      # BREVO is the one that works for a demo with no domain: it verifies a
      # single sender ADDRESS (a plain Gmail is fine) and will then deliver to
      # anyone. Resend's shared sender only reaches the account owner, which is
      # useless when other people are signing up. Free tier is 300/day.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false      # the address you verified in Brevo
      - key: BREVO_FROM_NAME
        value: Harmony

      # Resend: better once you own a domain. Render's free tier blocks outbound SMTP ports, so Gmail
      # cannot deliver from here however it is configured. Resend sends over
      # HTTPS, which is never blocked. Set RESEND_API_KEY and the SMTP_* values
      # below are ignored.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

      # SMTP fallback, for hosts that allow it. Gmail needs an App Password.
      # Leave everything unset and verification is skipped rather than blocking
      # signup.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # Used to build links inside emails.
      - key: PUBLIC_URL
        sync: false

      # NOTE: no FRONTEND_URL and no separate UI service. harmony-web is built
      # into this image (see Dockerfile stage 1) and served from the same origin,
      # so there is nothing to point at and no CORS to configure.
