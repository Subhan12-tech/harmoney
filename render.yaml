# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file
# and creates BOTH the database and the API service.
#
# Secrets are marked `sync: false` on purpose: Render prompts for them at deploy
# time and stores them encrypted. They must never live in this file, which is
# committed to the repo.

databases:
  - name: harmony-db
    databaseName: harmony
    user: harmony
    plan: free            # NOTE: Render's free Postgres is DELETED after 90 days.
    region: oregon        # keep the DB and the service in the SAME region

services:
  - type: web
    name: harmony-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free            # sleeps after ~15 min idle; see the free-tier notes in README_RENDER.md
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production           # makes auth.py refuse to boot without a real key

      - key: APP_SECRET_KEY
        generateValue: true         # Render generates a strong value once and keeps it

      # The single account allowed to grant and revoke customer access.
      # Set this to YOUR email in the Render dashboard.
      - key: PLATFORM_OWNER_EMAIL
        sync: false

      # approval = new customers wait for you; open = self-serve signup
      - key: HARMONY_SIGNUP_MODE
        value: approval

      - key: APP_DATABASE_URL
        fromDatabase:
          name: harmony-db
          property: connectionString

      # --- set these in the Render dashboard; never commit them ---
      - key: MISTRAL_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # Comma-separated origins allowed to call this API.
      # e.g. https://harmony-web.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # Where the product UI (harmony-web) is deployed. Once set, this API's
      # root redirects there instead of serving the built-in fallback dashboard,
      # so there is only ever one live interface.
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Product UI (Next.js). Separate service because it is a Node server, not the
  # Python image - /app/review/[id] is server-rendered on demand, so this cannot
  # be a static site.
  # ---------------------------------------------------------------------------
  - type: web
    name: harmony-web
    runtime: node
    rootDir: harmony-web
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true

    envVars:
      # Baked in at BUILD time, not read at runtime - changing it needs a
      # rebuild, not a restart.
      #
      # Entered by hand rather than wired with fromService: that yields a bare
      # hostname, and this needs a full origin including https://. Set it to the
      # harmony-api service URL, e.g. https://harmoney.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
